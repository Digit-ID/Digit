document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"97695333-14eb-49ec-8373-921945f41887\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#1F6FEB\">\n<title>Digit<\u002Ftitle>\n<style>\nhtml, body { margin: 0; padding: 0; background: #F4F6FD; }\na { color: #0052FF; text-decoration: none; }\na:hover { color: #0047DD; text-decoration: underline; }\ninput, select, button { font-family: inherit; }\n@keyframes pulsar { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.93); } }\nhtml.tema-escuro { color-scheme: dark; --bg: #0C1424; --card: #152133; --input: #0F1A2C; --chip: #1B2E52; --text: #E8ECF4; --mist: #93A1B5; --line: #233149; background: #0C1424; }\nhtml.tema-escuro body { background: #0C1424; }\n@media (max-width: 600px) {\n  input, select, textarea { font-size: 16px !important; }\n  main { padding-top: 26px !important; }\n}\n@media (max-width: 560px) {\n  [data-m-hide] { display: none !important; }\n  [data-m-logo] { height: 34px !important; }\n}\n<\u002Fstyle>\n<link rel=\"icon\" type=\"image/png\" href=\"e5a16bee-678f-48ff-8090-08f0cedb6eb6\">\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Digit\">\n<link rel=\"apple-touch-icon\" href=\"0ae24a15-1b24-4eeb-b182-69adeba38819\">\n<\u002Fhelmet>\n<div style=\"min-height:100vh;font-family:Calibri,'Segoe UI',-apple-system,sans-serif;color:var(--text,#0B1533)\">\n  <sc-if value=\"{{ eBoot }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center\">\n      <img src=\"e7a20daf-20bb-4217-a40e-7484be548ed6\" alt=\"Digit\" style=\"width:56px;animation:pulsar 1.4s ease-in-out infinite\">\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ eIframePreso }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;box-sizing:border-box\">\n      <img src=\"e7a20daf-20bb-4217-a40e-7484be548ed6\" alt=\"Digit\" style=\"width:44px\">\n      <div style=\"font-size:15px;font-weight:700\">Versão antiga guardada no dispositivo<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--mist,#6B77A8);max-width:300px;line-height:1.5\">Este ecrã abriu uma cópia antiga da app que ficou em cache. Toca no botão para carregar a versão atual.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ recarregarApp }}\" style=\"background:#1F6FEB;color:#FFFFFF;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer\">Recarregar versão atual<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ eHome }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;display:flex;flex-direction:column\">\n      <header style=\"background:var(--card,#FFFFFF);border-bottom:1px solid var(--line,#E2E6F5);position:sticky;top:0;z-index:5;transition:transform 0.28s ease;transform:{{ headerTransform }}\">\n        <div style=\"max-width:1060px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <img data-m-logo=\"1\" src=\"29b27e3c-bfce-4bb2-99f5-6a9237f6dc5d\" alt=\"Digit\" style=\"height:44px;width:auto\">\n          <\u002Fdiv>\n          <div ref=\"{{ refMenus }}\" style=\"display:flex;align-items:center;gap:12px;position:relative\">\n            <div style=\"display:flex;align-items:center;gap:12px;background:var(--card,#FFFFFF);border:1px solid var(--line,#E2E6F5);border-radius:16px;padding:6px 10px 6px 6px;box-shadow:0 2px 8px rgba(16,25,54,0.05)\">\n              <div sc-camel-on-click=\"{{ alternarPerfil }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:12px;padding:2px\" style-hover=\"opacity:0.85\">\n                <sc-if value=\"{{ temFoto }}\" hint-placeholder-val=\"{{ false }}\">{{ avatarImg38 }}<\u002Fsc-if>\n                <sc-if value=\"{{ semFoto }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"width:38px;height:38px;border-radius:50%;background:#1F6FEB;color:#FFFFFF;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{ iniciais }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;flex-direction:column;gap:1px\">\n                  <span data-m-hide=\"1\" style=\"font-size:14px;font-weight:700;color:var(--text,#0B1533);line-height:1.2\">{{ primeiroNome }}<\u002Fspan>\n                  <span data-m-hide=\"1\" style=\"font-size:12px;color:var(--mist,#97A0C3);line-height:1.2\">{{ emailUser }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ aoSair }}\" title=\"Terminar sessão\" style=\"background:none;border:none;color:var(--mist,#3A4569);cursor:pointer;padding:6px;display:flex;align-items:center\" style-hover=\"color:#B3261E\">\n                <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"><\u002Fpath><path d=\"M16 17l5-5-5-5\"><\u002Fpath><path d=\"M21 12H9\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ alternarNotif }}\" title=\"Notificações\" style=\"position:relative;background:var(--card,#FFFFFF);border:1px solid var(--line,#E2E6F5);border-radius:12px;width:44px;height:44px;color:var(--mist,#3A4569);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none\" style-hover=\"border-color:#1F6FEB;color:#1F6FEB\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9\"><\u002Fpath><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"><\u002Fpath><\u002Fsvg>\n              <sc-if value=\"{{ temNotificacoes }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"position:absolute;top:-5px;right:-5px;background:#B3261E;color:#FFFFFF;font-size:10px;font-weight:800;border-radius:9px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px\">{{ contagemNotif }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n            <sc-if value=\"{{ menuNotif }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;top:52px;right:0;width:min(320px,92vw);background:var(--card,#FFFFFF);border:1px solid var(--line,#E2E6F5);border-radius:16px;box-shadow:0 18px 44px rgba(16,25,54,0.14);padding:16px;z-index:30;display:flex;flex-direction:column;gap:8px\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mist,#97A0C3);margin-bottom:2px\">NOTIFICAÇÕES<\u002Fdiv>\n                <sc-for list=\"{{ notificacoes }}\" as=\"n\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ n.abrir }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px;border-radius:9px\" style-hover=\"background:var(--chip,#F2F5FD)\">\n                    <span style=\"width:8px;height:8px;border-radius:50%;background:{{ n.cor }};flex:none\"><\u002Fspan>\n                    <span style=\"font-size:13px;flex:1;line-height:1.4\">{{ n.texto }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;color:var(--mist,#97A0C3);flex:none\">abrir →<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ semNotificacoes }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:13px;color:var(--mist,#97A0C3);padding:6px 8px\">Está tudo em dia. 0 pendentes.<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ menuPerfil }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;top:52px;right:0;width:min(300px,92vw);background:var(--card,#FFFFFF);border:1px solid var(--line,#E2E6F5);border-radius:16px;box-shadow:0 18px 44px rgba(16,25,54,0.14);padding:20px;z-index:30;display:flex;flex-direction:column;gap:14px\">\n                <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n                  <sc-if value=\"{{ temFoto }}\" hint-placeholder-val=\"{{ false }}\">{{ avatarImg72 }}<\u002Fsc-if>\n                  <sc-if value=\"{{ semFoto }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"width:72px;height:72px;border-radius:50%;background:var(--chip,#EAF0FF);color:#0052FF;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{ iniciais }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <input ref=\"{{ refFoto }}\" type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ aoMudarFoto }}\" style=\"display:none\">\n                  <button sc-camel-on-click=\"{{ escolherFoto }}\" style=\"background:none;border:1px solid var(--line,#E2E6F5);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;color:#0052FF;cursor:pointer\" style-hover=\"border-color:#0052FF\">Alterar foto<\u002Fbutton>\n                  \n                <\u002Fdiv>\n                <div style=\"border-top:1px solid var(--line,#EEF0FA);padding-top:12px;display:flex;flex-direction:column;gap:4px\">\n                  <sc-if value=\"{{ naoEditandoPerfil }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"font-size:15px;font-weight:700\">{{ nomeCompleto }}<\u002Fdiv>\n                    <div style=\"font-size:13px;color:var(--mist,#6B77A8)\">{{ emailUser }}<\u002Fdiv>\n                    <div style=\"font-size:13px;color:var(--mist,#6B77A8)\">{{ departamentoUser }}<\u002Fdiv>\n                    <a href=\"#\" sc-camel-on-click=\"{{ comecarEditar }}\" style=\"font-size:12.5px;margin-top:4px\">Editar dados<\u002Fa>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ editandoPerfil }}\" hint-placeholder-val=\"{{ false }}\">\n                    <input ref=\"{{ refEditNome }}\" type=\"text\" sc-camel-default-value=\"{{ nomeCompleto }}\" placeholder=\"Nome completo\" style=\"border:1px solid var(--line,#E5E7EB);border-radius:9px;padding:9px 10px;font-size:13px;outline:none;background:var(--input,#FFFFFF);color:var(--text,#111827);width:100%;box-sizing:border-box\">\n                    <sc-raw-select ref=\"{{ refEditDep }}\" sc-camel-default-value=\"{{ departamentoUser }}\" style=\"border:1px solid var(--line,#E5E7EB);border-radius:9px;padding:9px 10px;font-size:13px;outline:none;background:var(--input,#FFFFFF);color:var(--text,#111827);width:100%;box-sizing:border-box;background:var(--card,#FFFFFF)\">\n                      <sc-for list=\"{{ departamentos }}\" as=\"d\" hint-placeholder-count=\"3\">\n                        <option value=\"{{ d }}\">{{ d }}<\u002Foption>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-select>\n                    <div style=\"display:flex;gap:8px;margin-top:4px\">\n                      <button sc-camel-on-click=\"{{ guardarPerfil }}\" style=\"flex:1;background:#1F6FEB;color:#FFFFFF;border:none;border-radius:8px;padding:8px;font-size:12.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#185FD1\">Guardar<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ cancelarEditar }}\" style=\"flex:1;background:none;border:1px solid var(--line,#E5E7EB);border-radius:8px;padding:8px;font-size:12.5px;font-weight:600;color:var(--mist,#6B77A8);cursor:pointer\" style-hover=\"border-color:var(--mist,#6B77A8)\">Cancelar<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"border-top:1px solid var(--line,#EEF0FA);padding-top:12px;display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mist,#97A0C3)\">AS TUAS APPS<\u002Fdiv>\n                  <sc-for list=\"{{ apps }}\" as=\"app\" hint-placeholder-count=\"3\">\n                    <div sc-camel-on-click=\"{{ app.abrir }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px;border-radius:9px\" style-hover=\"background:var(--chip,#F2F5FD)\">\n                      <div style=\"width:26px;height:26px;border-radius:7px;background:{{ app.cor }};color:#FFFFFF;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{ app.letra }}<\u002Fdiv>\n                      <span style=\"font-size:13.5px;font-weight:600;flex:1\">{{ app.nome }}<\u002Fspan>\n                      <span style=\"font-size:12px;color:var(--mist,#97A0C3)\">abrir →<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"border-top:1px solid var(--line,#EEF0FA);padding-top:10px;display:flex;flex-direction:column;gap:6px\">\n                  <button sc-camel-on-click=\"{{ alternarTema }}\" style=\"background:none;border:1px solid var(--line,#E2E6F5);border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;color:var(--mist,#3A4569);cursor:pointer;text-align:left;padding-left:12px\" style-hover=\"border-color:#1F6FEB;color:#1F6FEB\">{{ rotuloTema }}<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ abrirSugestao }}\" style=\"background:none;border:1px solid var(--line,#E2E6F5);border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;color:var(--mist,#3A4569);cursor:pointer;text-align:left;padding-left:12px\" style-hover=\"border-color:#1F6FEB;color:#1F6FEB\">Sugestão ou problema<\u002Fbutton>\n                  <sc-if value=\"{{ eAdminUser }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ abrirAdmin }}\" style=\"background:none;border:1px solid var(--line,#E2E6F5);border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;color:var(--mist,#3A4569);cursor:pointer;text-align:left;padding-left:12px\" style-hover=\"border-color:#1F6FEB;color:#1F6FEB\">Administração<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ aoSair }}\" style=\"background:#FDEEEF;border:none;border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;color:#B3261E;cursor:pointer\" style-hover=\"background:#F9DDE0\">Terminar sessão<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fheader>\n      <main style=\"max-width:1060px;margin:0 auto;padding:52px 20px 40px;width:100%;box-sizing:border-box;flex:1\">\n        <h1 style=\"font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-0.6px;margin:0 0 8px\">Olá, {{ primeiroNome }}.<\u002Fh1>\n        <p style=\"font-size:15px;color:var(--mist,#6B77A8);margin:0 0 34px\">Escolhe a aplicação onde queres entrar.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px\">\n          <sc-for list=\"{{ apps }}\" as=\"app\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ app.abrir }}\" style=\"background:var(--card,#FFFFFF);border:1px solid var(--line,#E2E6F5);border-radius:18px;padding:26px;cursor:pointer;display:flex;flex-direction:column;gap:14px;transition:box-shadow 0.18s,transform 0.18s\" style-hover=\"box-shadow:0 14px 34px rgba(16,25,54,0.10);transform:translateY(-2px)\">\n              <div style=\"width:54px;height:54px;border-radius:14px;background:{{ app.cor }};color:#FFFFFF;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{ app.letra }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <div style=\"font-size:19px;font-weight:800;letter-spacing:-0.3px\">{{ app.nome }}<\u002Fdiv>\n                  <sc-if value=\"{{ app.recente }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size:10.5px;font-weight:700;letter-spacing:0.5px;color:#1F6FEB;background:var(--chip,#EAF0FF);border-radius:6px;padding:3px 7px\">RECENTE<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.55;color:var(--mist,#6B77A8);text-wrap:pretty\">{{ app.descricao }}<\u002Fdiv>\n                <sc-if value=\"{{ app.temBadge }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:12px;font-weight:600;color:{{ app.badgeCor }};background:{{ app.badgeBg }};border-radius:7px;padding:5px 9px;align-self:flex-start;margin-top:2px\">{{ app.badgeTexto }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ app.temResumo }}\" hint-placeholder-val=\"{{ false }}\">\n                  \n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:auto\">\n                <span style=\"font-size:14px;font-weight:700;color:{{ app.cor }}\">Entrar →<\u002Fspan>\n                <button sc-camel-on-click=\"{{ app.abrirSeparador }}\" title=\"Abrir em separador novo\" style data-dc-script=\"\" data-props=\"{\n  &quot;modoDemo&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Comportamento&quot; },\n  &quot;abrirEmSeparador&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Comportamento&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { vista: \"boot\", user: null, registo: false, erro: \"\", aviso: \"\", aCarregar: false, appAtiva: null, mostrarPass: false, menuPerfil: false, foto: \"\", preview: null, tema: \"claro\", editarPerfil: false, badges: {}, ultimaApp: \"\", admin: null, menuNotif: false, notificacoes: [], onboarding: false, adminFiltro: \"\", falhaLigacao: false, avisos: [], ligacoes: [], novos: [], eduProg: null, spotResumo: \"\", mostrarSugestao: false, sugestaoEnviada: false };\n  lembrar = true;\n\n  constructor(props) {\n    super(props);\n    this.rNome = React.createRef();\n    this.rDep = React.createRef();\n    this.rEmail = React.createRef();\n    this.rPass = React.createRef();\n    this.rFoto = React.createRef();\n    this.rEditNome = React.createRef();\n    this.rEditDep = React.createRef();\n    this.rNovaPass = React.createRef();\n    this.rNovaPass2 = React.createRef();\n    this.rMenus = React.createRef();\n    this.rSugestao = React.createRef();\n    this.rAvisoTitulo = React.createRef();\n    this.rAvisoTexto = React.createRef();\n    this.rLigNome = React.createRef();\n    this.rLigUrl = React.createRef();\n    this.LIGACOES_PADRAO = [\n      { id: \"l1\", nome: \"digit.com.pt\", url: \"https://digit.com.pt\" },\n      { id: \"l2\", nome: \"Teams\", url: \"https://teams.microsoft.com\" },\n      { id: \"l3\", nome: \"Outlook\", url: \"https://outlook.office.com\" },\n      { id: \"l4\", nome: \"Portal das Finanças\", url: \"https://www.portaldasfinancas.gov.pt\" },\n      { id: \"l5\", nome: \"e-fatura\", url: \"https://faturas.portaldasfinancas.gov.pt\" },\n      { id: \"l6\", nome: \"Segurança Social Direta\", url: \"https://app.seg-social.pt\" }\n    ];\n    this.sb = null;\n    this.demo = false;\n    this.CFG = { url: \"https://aucnnpvdbvqwijamjokm.supabase.co\", chave: \"sb_publishable_oMc9Ls4Te9w5MlkuTiuMaQ_pRaEaF1j\" };\n    this.APPS = [\n      { id: \"diginote\", nome: \"DigiNote\", descricao: \"As tuas notas e registos do dia a dia, sempre à mão.\", url: \"https://digit-id.github.io/diginote/\", cor: \"#1F6FEB\", letra: \"N\" },\n      { id: \"digispot\", nome: \"DigiSpot\", descricao: \"Reserva o teu lugar, estacionamento e salas de reuniões.\", url: \"https://digit-id.github.io/DigiSpot/\", cor: \"#0052FF\", letra: \"S\" },\n      { id: \"digieduca\", nome: \"DigiEduca\", descricao: \"As tuas formações, certificados e conformidade com o AI Act.\", url: \"https://digit-id.github.io/DigiEduca/\", cor: \"#0052FF\", letra: \"E\" }\n    ];\n    this.FERRAMENTAS = [\n      { id: \"conciliador\", nome: \"Conciliador de contas\", url: \"https://digit-id.github.io/Digit_Contas_Correntes/\", cor: \"#1F6FEB\", letra: \"C\" },\n      { id: \"editorpdf\", nome: \"Editor PDF\", url: \"https://digit-id.github.io/Digit_Editor_PDF/\", cor: \"#0052FF\", letra: \"P\" }\n    ];\n  }\n\n  componentDidMount() {\n    let t = \"claro\";\n    try { t = localStorage.getItem(\"digitTema\") || \"claro\"; } catch (e) {}\n    this.aplicarTema(t);\n    this.iniciar();\n    this.aoTecla = (e) => {\n      const tag = (e.target.tagName || \"\").toLowerCase();\n      if (tag === \"input\" || tag === \"select\" || tag === \"textarea\") return;\n      if (e.key === \"Escape\") {\n        if (this.state.preview) this.setState({ preview: null });\n        else if (this.state.menuPerfil || this.state.menuNotif) this.setState({ menuPerfil: false, menuNotif: false });\n        else if (this.state.vista === \"app\" || this.state.vista === \"admin\") this.setState({ vista: \"home\", appAtiva: null });\n        return;\n      }\n      if (this.state.vista === \"home\" && [\"1\", \"2\", \"3\"].includes(e.key)) this.abrirApp(this.APPS[Number(e.key) - 1]);\n    };\n    window.addEventListener(\"keydown\", this.aoTecla);\n    this.aoCliqueFora = (e) => {\n      if (!(this.state.menuPerfil || this.state.menuNotif)) return;\n      const c = this.rMenus.current;\n      if (c && !c.contains(e.target)) this.setState({ menuPerfil: false, menuNotif: false });\n    };\n    document.addEventListener(\"mousedown\", this.aoCliqueFora);\n    this.ultimoScroll = 0;\n    this.aoScroll = () => {\n      const y = window.scrollY || 0;\n      const oculto = y > this.ultimoScroll + 4 && y > 70;\n      const visivel = y < this.ultimoScroll - 4 || y <= 70;\n      if (oculto && !this.state.headerOculto) this.setState({ headerOculto: true, menuPerfil: false, menuNotif: false });\n      else if (visivel && this.state.headerOculto) this.setState({ headerOculto: false });\n      this.ultimoScroll = y;\n    };\n    window.addEventListener(\"scroll\", this.aoScroll, { passive: true });\n    if (\"serviceWorker\" in navigator && location.protocol.startsWith(\"http\")) {\n      navigator.serviceWorker.register(\"./sw.js\").catch(() => {});\n    }\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"keydown\", this.aoTecla);\n    document.removeEventListener(\"mousedown\", this.aoCliqueFora);\n    window.removeEventListener(\"scroll\", this.aoScroll);\n  }\n\n  verOnboarding() {\n    let visto = \"\";\n    try { visto = localStorage.getItem(\"digitOnboardingVisto\") || \"\"; } catch (e) {}\n    if (!visto) this.setState({ onboarding: true });\n  }\n\n  fecharOnboarding = () => {\n    try { localStorage.setItem(\"digitOnboardingVisto\", \"1\"); } catch (e) {}\n    this.setState({ onboarding: false });\n  };\n\n  aplicarTema(t) {\n    try { localStorage.setItem(\"digitTema\", t); } catch (e) {}\n    document.documentElement.classList.toggle(\"tema-escuro\", t === \"escuro\");\n    this.setState({ tema: t });\n  }\n\n  async iniciar() {\n    // Guarda anti-recursão: se o portal for servido dentro do iframe de uma app (cache antiga), mostra aviso em vez de portal-dentro-do-portal\n    try {\n      if (window.self !== window.top && /digit-id\\.github\\.io|digit\\.com\\.pt/i.test(document.referrer || \"\")) {\n        this.setState({ vista: \"iframePreso\" });\n        return;\n      }\n    } catch (e) {}\n    if (this.props.modoDemo) {\n      this.demo = true;\n      let u = null;\n      try { u = JSON.parse(localStorage.getItem(\"digitHubDemoUser\") || \"null\"); } catch (e) {}\n      this.setState({ vista: u ? \"home\" : \"login\", user: u, aviso: \"Modo de demonstração — sem ligação real ao Supabase.\" });\n      return;\n    }\n    try {\n      const { createClient } = await import(\"https://esm.sh/@supabase/supabase-js@2\");\n      const mem = {};\n      const cofre = {\n        getItem: (k) => { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : null; },\n        setItem: (k, v) => { try { localStorage.setItem(k, v); delete mem[k]; } catch (e) { mem[k] = v; } },\n        removeItem: (k) => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }\n      };\n      this.sb = createClient(this.CFG.url, this.CFG.chave, { auth: { storage: cofre, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });\n      this.sb.auth.onAuthStateChange((ev, sess) => { this.sessao = sess; });\n      const { data } = await this.sb.auth.getSession();\n      this.sessao = data && data.session;\n      const recuperacao = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);\n      if (data && data.session && recuperacao) {\n        this.setState({ vista: \"recuperar\" });\n      } else if (data && data.session) {\n        const user = await this.carregarPerfil(data.session.user);\n        const meta = data.session.user.user_metadata || {};\n        let foto = meta.avatar_url || \"\";\n        if (foto.slice(0, 5) === \"data:\") this.limparFotoInchada(foto);\n        if (!foto) { try { foto = localStorage.getItem(\"digitFotoPerfil\") || \"\"; } catch (e) {} }\n        let ultimaApp = \"\";\n        try { ultimaApp = localStorage.getItem(\"digitUltimaApp\") || \"\"; } catch (e) {}\n        if (user.ativo === false) {\n          await this.sb.auth.signOut();\n          this.setState({ vista: \"login\", aviso: \"A tua conta aguarda aprovação da administração da Digit.\" });\n          return;\n        }\n        this.setState({ vista: \"home\", user, foto, ultimaApp });\n        this.carregarBadges(user);\n        this.carregarExtras(user);\n        this.verOnboarding();\n      } else this.setState({ vista: \"login\" });\n    } catch (e) {\n      this.demo = true;\n      let u = null;\n      try { u = JSON.parse(localStorage.getItem(\"digitHubDemoUser\") || \"null\"); } catch (err) {}\n      this.setState({ vista: u ? \"home\" : \"login\", user: u, falhaLigacao: true, aviso: \"Sem ligação ao Supabase neste momento — a usar modo de demonstração.\" });\n    }\n  }\n\n  async carregarPerfil(authUser) {\n    try {\n      const r = await this.sb.from(\"perfis\").select(\"*\").eq(\"id\", authUser.id).single();\n      if (r.data) return r.data;\n    } catch (e) {}\n    const nome = (authUser.user_metadata && authUser.user_metadata.nome) || authUser.email.split(\"@\")[0].replace(/\\./g, \" \");\n    return { nome, email: authUser.email };\n  }\n\n  aoSubmeter = async (ev) => {\n    ev.preventDefault();\n    let email = String(this.rEmail.current.value || \"\").trim().toLowerCase();\n    if (email && !email.includes(\"@\")) email += \"@digit.com.pt\";\n    const pass = this.rPass.current.value || \"\";\n    if (!email.endsWith(\"@digit.com.pt\")) { this.setState({ erro: \"Usa o teu endereço @digit.com.pt.\" }); return; }\n    try { if (this.lembrar) localStorage.setItem(\"digitHubEmail\", email.replace(\"@digit.com.pt\", \"\")); else localStorage.removeItem(\"digitHubEmail\"); } catch (e) {}\n    this.setState({ erro: \"\", aCarregar: true });\n    try {\n      if (this.demo) {\n        const nome = this.state.registo && this.rNome.current ? this.rNome.current.value : email.split(\"@\")[0].replace(/\\./g, \" \");\n        const user = { nome: nome || \"Colaborador\", email };\n        localStorage.setItem(\"digitHubDemoUser\", JSON.stringify(user));\n        this.setState({ vista: \"home\", user, aCarregar: false });\n        return;\n      }\n      let d;\n      if (this.state.registo) {\n        const nome = this.rNome.current.value || \"\";\n        const departamento = this.rDep.current.value || \"\";\n        d = await this.sb.auth.signUp({ email, password: pass, options: { data: { nome, departamento } } });\n        if (d.error) throw d.error;\n        if (!d.data.session) throw new Error(\"Conta criada. Confirma o email para entrar.\");\n      } else {\n        d = await this.sb.auth.signInWithPassword({ email, password: pass });\n        if (d.error) throw d.error;\n      }\n      const metaE = (d.data.user && d.data.user.user_metadata) || {};\n      if (metaE.avatar_url && metaE.avatar_url.slice(0, 5) === \"data:\") this.limparFotoInchada(metaE.avatar_url);\n      const user = await this.carregarPerfil(d.data.user);\n      if (user.ativo === false) {\n        await this.sb.auth.signOut();\n        throw new Error(\"A tua conta aguarda aprovação da administração da Digit.\");\n      }\n      this.setState({ vista: \"home\", user, aCarregar: false });\n      this.carregarBadges(user);\n      this.carregarExtras(user);\n      this.verOnboarding();\n    } catch (e) {\n      this.setState({ erro: e.message || String(e), aCarregar: false });\n    }\n  };\n\n  async carregarBadges(user) {\n    if (!this.sb || !user || !user.id) return;\n    const badges = {};\n    try {\n      const [cur, prog] = await Promise.all([\n        this.sb.from(\"cursos\").select(\"slug\").eq(\"obrigatorio\", true).eq(\"estado\", \"disponivel\"),\n        this.sb.from(\"progresso\").select(\"curso_slug,estado\").eq(\"utilizador_id\", user.id)\n      ]);\n      if (cur.data) {\n        const feitos = new Set((prog.data || []).filter(p => p.estado === \"concluido\").map(p => p.curso_slug));\n        const total = cur.data.length;\n        const conc = cur.data.filter(c => feitos.has(c.slug)).length;\n        const pend = total - conc;\n        badges.digieduca = pend > 0\n          ? { texto: pend + (pend === 1 ? \" formação obrigatória pendente\" : \" formações obrigatórias pendentes\"), cor: \"#B3261E\", bg: \"#FDEEEF\" }\n          : { texto: \"Formações obrigatórias em dia\", cor: \"#1B7F4B\", bg: \"#E9F7EF\" };\n        if (total > 0) this.setState({ eduProg: { conc, total, pct: Math.round(conc * 100 / total) } });\n      }\n    } catch (e) {}\n    try {\n      const r = await this.sb.from(\"digispot_shared\").select(\"dados\").eq(\"colecao\", \"bookings\").maybeSingle();\n      const dados = (r.data && r.data.dados) || {};\n      const hoje = new Date().toISOString().slice(0, 10);\n      const dia = dados[hoje];\n      const meu = dia && Object.values(dia).some(b => b && b.name === user.nome);\n      let diasSemana = 0;\n      for (let k = 0; k < 7; k++) {\n        const iso = new Date(Date.now() + k * 864e5).toISOString().slice(0, 10);\n        const d = dados[iso];\n        if (d && Object.values(d).some(b => b && b.name === user.nome)) diasSemana++;\n      }\n      badges.digispot = meu\n        ? { texto: \"Tens reserva para hoje\", cor: \"#1B7F4B\", bg: \"#E9F7EF\" }\n        : { texto: \"Sem reserva para hoje\", cor: \"#6B77A8\", bg: \"#F2F5FD\" };\n      this.setState({ spotResumo: diasSemana > 0 ? (diasSemana === 1 ? \"1 dia reservado nos próximos 7\" : diasSemana + \" dias reservados nos próximos 7\") : \"\" });\n    } catch (e) {}\n    const notificacoes = [];\n    if (badges.digieduca && badges.digieduca.cor === \"#B3261E\") notificacoes.push({ id: \"n1\", texto: badges.digieduca.texto, cor: \"#B3261E\", appId: \"digieduca\" });\n    if (badges.digispot && badges.digispot.cor === \"#6B77A8\") notificacoes.push({ id: \"n2\", texto: \"Ainda não tens lugar reservado para hoje\", cor: \"#1F6FEB\", appId: \"digispot\" });\n    try {\n      const desde = new Date(Date.now() - 7 * 864e5).toISOString();\n      const c = await this.sb.from(\"certificados\").select(\"id\").eq(\"utilizador_id\", user.id).eq(\"valido\", true).gte(\"emitido_em\", desde);\n      if (c.data && c.data.length) notificacoes.push({ id: \"n3\", texto: c.data.length === 1 ? \"Tens 1 certificado novo esta semana\" : \"Tens \" + c.data.length + \" certificados novos esta semana\", cor: \"#1B7F4B\", appId: \"digieduca\" });\n    } catch (e) {}\n    this.setState({ badges, notificacoes });\n  }\n\n  async carregarExtras(user) {\n    if (!this.sb) return;\n    try {\n      const r = await this.sb.from(\"avisos\").select(\"id,titulo,texto,criado_em\").order(\"criado_em\", { ascending: false }).limit(5);\n      if (r.data) this.setState({ avisos: r.data });\n    } catch (e) {}\n    try {\n      const r = await this.sb.from(\"ligacoes\").select(\"id,nome,url,ordem\").order(\"ordem\");\n      if (r.data && r.data.length) this.setState({ ligacoes: r.data });\n    } catch (e) {}\n    try {\n      const desde = new Date(Date.now() - 14 * 864e5).toISOString();\n      const r = await this.sb.from(\"perfis\").select(\"nome,departamento,criado_em\").gte(\"criado_em\", desde).neq(\"id\", user.id).order(\"criado_em\", { ascending: false }).limit(6);\n      if (r.data && r.data.length) this.setState({ novos: r.data });\n    } catch (e) {}\n  }\n\n  enviarSugestao = async (ev) => {\n    ev.preventDefault();\n    const texto = (this.rSugestao.current && this.rSugestao.current.value || \"\").trim();\n    if (!texto) return;\n    if (this.sb) this.sb.rpc(\"registar_auditoria\", { p_acao: \"sugestao\", p_entidade: \"portal\", p_detalhe: { texto } }).then(() => {}, () => {});\n    this.setState({ sugestaoEnviada: true });\n    setTimeout(() => this.setState({ mostrarSugestao: false, sugestaoEnviada: false }), 1600);\n  };\n\n  publicarAviso = async () => {\n    const titulo = (this.rAvisoTitulo.current && this.rAvisoTitulo.current.value || \"\").trim();\n    const texto = (this.rAvisoTexto.current && this.rAvisoTexto.current.value || \"\").trim();\n    if (!titulo || !this.sb) return;\n    try {\n      const r = await this.sb.from(\"avisos\").insert({ titulo, texto }).select().single();\n      if (!r.error && r.data) {\n        this.rAvisoTitulo.current.value = \"\"; this.rAvisoTexto.current.value = \"\";\n        this.setState({ avisos: [r.data, ...this.state.avisos].slice(0, 5) });\n      }\n    } catch (e) {}\n  };\n\n  removerAviso = async (id) => {\n    if (!this.sb) return;\n    try { await this.sb.from(\"avisos\").delete().eq(\"id\", id); } catch (e) {}\n    this.setState({ avisos: this.state.avisos.filter(a => a.id !== id) });\n  };\n\n  adicionarLigacao = async () => {\n    const nome = (this.rLigNome.current && this.rLigNome.current.value || \"\").trim();\n    let url = (this.rLigUrl.current && this.rLigUrl.current.value || \"\").trim();\n    if (!nome || !url || !this.sb) return;\n    if (!/^https?:/.test(url)) url = \"https://\" + url;\n    try {\n      const r = await this.sb.from(\"ligacoes\").insert({ nome, url, ordem: this.state.ligacoes.length + 1 }).select().single();\n      if (!r.error && r.data) {\n        this.rLigNome.current.value = \"\"; this.rLigUrl.current.value = \"\";\n        this.setState({ ligacoes: [...this.state.ligacoes, r.data] });\n      }\n    } catch (e) {}\n  };\n\n  removerLigacao = async (id) => {\n    if (!this.sb) return;\n    try { await this.sb.from(\"ligacoes\").delete().eq(\"id\", id); } catch (e) {}\n    this.setState({ ligacoes: this.state.ligacoes.filter(l => l.id !== id) });\n  };\n\n  gerarRelatorio = async () => {\n    if (!this.sb) return;\n    try {\n      const r = await this.sb.from(\"vw_conformidade_ai_act\").select(\"*\").order(\"nome\");\n      const linhas = r.data || [];\n      const w = window.open(\"\", \"_blank\");\n      if (!w) { alert(\"Permite pop-ups para gerar o relatório.\"); return; }\n      const rows = linhas.map(l => \"<tr><td>\" + (l.nome || \"\") + \"<\u002Ftd><td>\" + (l.email || \"\") + \"<\u002Ftd><td>\" + (l.departamento || \"—\") + \"<\u002Ftd><td>\" + l.obrigatorios_concluidos + \" / \" + l.obrigatorios_total + \"<\u002Ftd><td class='\" + (l.conforme ? \"ok\" : \"nok\") + \"'>\" + (l.conforme ? \"Conforme\" : \"Pendente\") + \"<\u002Ftd><\u002Ftr>\").join(\"\");\n      const sc = \"scr\" + \"ipt\";\n      w.document.write(\"<!DOCTYPE html><html lang='pt'><head><meta charset='utf-8'><title>Digit · Relatório de conformidade AI Act<\u002Ftitle><style>body{font-family:Calibri,'Segoe UI',sans-serif;color:#0B1533;padding:36px;max-width:900px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}.sub{color:#6B77A8;font-size:13px;margin-bottom:24px}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;letter-spacing:1px;color:#6B77A8;border-bottom:2px solid #E2E6F5;padding:8px 6px}td{border-bottom:1px solid #EEF0FA;padding:8px 6px}.ok{color:#1B7F4B;font-weight:700}.nok{color:#B3261E;font-weight:700}.rodape{margin-top:28px;font-size:11px;color:#97A0C3}<\u002Fstyle><\u002Fhead><body><h1>Relatório de conformidade — Art. 4.º do AI Act<\u002Fh1><div class='sub'>Digit · gerado a \" + new Date().toLocaleDateString(\"pt-PT\") + \" pelo portal Digit<\u002Fdiv><table><tr><th>COLABORADOR<\u002Fth><th>EMAIL<\u002Fth><th>DEPARTAMENTO<\u002Fth><th>OBRIGATÓRIAS<\u002Fth><th>ESTADO<\u002Fth><\u002Ftr>\" + rows + \"<\u002Ftable><div class='rodape'>Prova documental do cumprimento do dever de formação (Regulamento (UE) 2024/1689). Fonte: DigiEduca / Supabase.<\u002Fdiv><\" + sc + \">window.print()<\u002F\" + sc + \"><\u002Fbody><\u002Fhtml>\");\n      w.document.close();\n    } catch (e) {}\n  };\n\n  aoDefinirPassword = async (ev) => {\n    ev.preventDefault();\n    const p1 = this.rNovaPass.current.value || \"\", p2 = this.rNovaPass2.current.value || \"\";\n    if (p1.length < 8) { this.setState({ erro: \"A palavra-passe precisa de pelo menos 8 caracteres.\" }); return; }\n    if (p1 !== p2) { this.setState({ erro: \"As palavras-passe não coincidem.\" }); return; }\n    this.setState({ erro: \"\", aCarregar: true });\n    try {\n      const d = await this.sb.auth.updateUser({ password: p1 });\n      if (d.error) throw d.error;\n      if (history.replaceState) history.replaceState(null, \"\", location.pathname);\n      const user = await this.carregarPerfil(d.data.user);\n      this.setState({ vista: \"home\", user, aCarregar: false });\n      this.carregarBadges(user);\n    } catch (e) { this.setState({ erro: e.message || String(e), aCarregar: false }); }\n  };\n\n  abrirAdmin = async () => {\n    this.setState({ vista: \"admin\", menuPerfil: false, admin: null });\n    if (!this.sb) return;\n    try {\n      const [perfis, audit] = await Promise.all([\n        this.sb.from(\"perfis\").select(\"id,nome,email,departamento,papel,ativo\").order(\"nome\"),\n        this.sb.from(\"auditoria\").select(\"email,acao,detalhe,criado_em\").order(\"criado_em\", { ascending: false }).limit(300)\n      ]);\n      this.setState({ admin: { perfis: perfis.data || [], auditoria: audit.data || [] } });\n    } catch (e) { this.setState({ admin: { perfis: [], auditoria: [] } }); }\n  };\n\n  alternarAtivo = async (p) => {\n    if (!this.sb) return;\n    try {\n      await this.sb.from(\"perfis\").update({ ativo: !p.ativo }).eq(\"id\", p.id);\n      const admin = this.state.admin;\n      this.setState({ admin: { ...admin, perfis: admin.perfis.map(x => x.id === p.id ? { ...x, ativo: !p.ativo } : x) } });\n    } catch (e) {}\n  };\n\n  exportarContas = () => {\n    const linhas = (this.state.admin && this.state.admin.perfis) || [];\n    if (!linhas.length) return;\n    const cols = [\"nome\",
